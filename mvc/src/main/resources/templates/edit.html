<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary mb-4" aria-label="Navegación principal">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Editar producto</span>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="card shadow-sm mx-auto" style="max-width: 400px;" aria-label="Formulario para editar un producto">
            <div class="card-body">
                <form method="post" action="/productos/actualizar">
                    <input type="hidden" name="id" value="{product.id}">
                    <div class="mb-3">
                        <label for="nombre" class="form-lable">Nombre</label>
                        <input id="nombre" name="nombre" type="text" class="form-control" value="{product.name}" required>
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-lable">Precio</label>
                        <input id="precio" name="precio" type="number" step="0.01" min="0" class="form-control" value="{product.price}" required>
                    </div>

                    <div class="mb-3">
                        <label for="stock" class="form-lable">Stock</label>
                        <input id="stock" name="stock" type="number" step="1" min="0" class="form-control" value="{product.stock}" required>
                    </div>

                    <button type="submit" class="btn btn-outline-success w-100">Actualizar</button>
                </form>

                <a href="/productos" class="btn btn-outline-warning w-100 mt-2">Volver al listado</a>
            </div>
        </section>
    </main>
</body>
</html>
