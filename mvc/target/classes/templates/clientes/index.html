<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary mb-4" aria-label="Navegación principal">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Listado de clientes</span>
                <a href="/productos" class="btn btn-outline-light btn-sm">Ver productos</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <a href="/clientes/nuevo" class="btn btn-primary">+ Nuevo Cliente</a>
        </section>

        <section class="card shadow-sm" aria-label="Lista de clientes">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Email</th>
                            <th scope="col">Productos</th>
                            <th scope="col" class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {#for client in clients}
                        <tr>
                            <td>{client.id}</td>
                            <td>{client.name}</td>
                            <td>{client.email}</td>
                            <td>{client.purchasedCount}</td>
                            <td class="text-end">
                                <a href="/clientes/editar/{client.id}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <a href="/clientes/eliminar/{client.id}" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Desea eliminar al cliente {client.name}?');">Eliminar</a>
                            </td>
                        </tr>
                        {/for}
                    </tbody>
                </table>
            </div>
            {#if clients.isEmpty}
            <p class="p-4 text-center text-muted mb-0">No hay clientes todavía. ¡Crea el primero!</p>
            {/if}
        </section>
    </main>

    <footer class="text-center text-muted py-3">
        <small>Ejemplo de MVC con Quarkus</small>
    </footer>
</body>
</html>
