<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary mb-4" aria-label="Navegación principal">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Editar cliente</span>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="card shadow-sm mx-auto" style="max-width: 500px;" aria-label="Formulario para editar un cliente">
            <div class="card-body">
                <form method="post" action="/clientes/actualizar">
                    <input type="hidden" name="id" value="{client.id}">

                    <div class="mb-3">
                        <label for="nombre" class="form-lable">Nombre</label>
                        <input id="nombre" name="nombre" type="text" class="form-control" value="{client.name}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-lable">Email</label>
                        <input id="email" name="email" type="email" class="form-control" value="{client.email}" required>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="form-lable h6">Productos comprados</legend>
                        <div class="border rounded p-2" style="max-height: 220px; overflow-y: auto;">
                            {#for product in products}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="productos"
                                       id="producto-{product.id}" value="{product.id}"
                                       checked?={client.purchasedProducts.contains(product)}>
                                <label class="form-check-label" for="producto-{product.id}">
                                    {product.name} &mdash; {product.price}
                                </label>
                            </div>
                            {/for}
                            {#if products.isEmpty}
                            <p class="text-muted mb-0">No hay productos registrados todavía.</p>
                            {/if}
                        </div>
                    </fieldset>

                    <button type="submit" class="btn btn-outline-success w-100">Actualizar</button>
                </form>

                <a href="/clientes" class="btn btn-outline-warning w-100 mt-2">Volver al listado</a>
            </div>
        </section>
    </main>
</body>
</html>
